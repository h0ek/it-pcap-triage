[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "it-pcap-triage"
version = "0.6"
description = "Offline IT PCAP analyzer using Zeek, Suricata and tshark."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Hoek" }
]
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6.0.1",
  "Jinja2>=3.1.3"
]

[project.scripts]
it-pcap-triage = "it_pcap_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
it_pcap_triage = [
  "report/templates/*.html",
  "data/*.yml"
]
